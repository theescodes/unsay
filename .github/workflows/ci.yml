name: CI

on:
  # Push CI on main too, so main's own state has a status; every change still
  # reaches main through a pull request.
  push:
    branches: [main]
  # pull_request, never pull_request_target: forks must not get a token or secrets.
  pull_request:
    branches: [main]
  workflow_dispatch:
  # release.yml runs this same suite on the release commit and publishes the zip it packs.
  workflow_call:
    inputs:
      release:
        description: Also pack the zip and upload it for release.yml to publish
        type: boolean
        default: false

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

# A new push to the same PR makes the running check obsolete; main always finishes. When
# release.yml calls this file, github.workflow is the caller's name, so a release build gets its
# own group and never queues behind main's push run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned exactly, never a bare `24`: ESLint's result cache keys on the node
  # version, so a bare major that resolves to a different patch during runner
  # image rollouts invalidates the cache. Renovate bumps it (customManagers).
  NODE_VERSION: '24.21.0'

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Installs the pnpm that package.json's packageManager pins, the Node above, and the
      # dependencies. require-lockfile fails the job when pnpm-lock.yaml is missing instead of
      # resolving afresh, and makes the install --frozen-lockfile. Besides the store (cache), the
      # action always caches pnpm's lockfile verification, so re-checking every entry against
      # minimumReleaseAge and trustPolicy stays cheap on an unchanged lockfile. The install's
      # `prepare` runs `wxt prepare`, which generates the .wxt/ types and aliases that check, lint
      # and dep:check resolve against.
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          require-lockfile: true

      - run: pnpm check

      - run: pnpm lint

      - run: pnpm dep:check

      - run: pnpm test

      - if: ${{ !inputs.release }}
        run: pnpm build

      # `wxt zip` builds first, then packs the extension for release.yml to publish.
      - if: ${{ inputs.release }}
        run: pnpm zip

      # The Chromium revision this Playwright release expects, and the system libraries it needs.
      - run: pnpm exec playwright install --with-deps chromium

      # The build from the step above (for a release, the one just zipped) in Chromium against the
      # fake claude.ai. Not `pnpm test:e2e`, which would build again first.
      - run: pnpm exec playwright test

      - if: ${{ inputs.release }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: .output/*-chrome.zip
          # .output/ starts with a dot; upload-artifact skips hidden paths unless told otherwise.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
